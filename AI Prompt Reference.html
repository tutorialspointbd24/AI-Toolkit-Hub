<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Prompt Reference · Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base: #f6f9fc;
            --bg-surface: #ffffff;
            --bg-sidebar: #0b1120;
            --text-primary: #0b1120;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --border-light: #e5e9f0;
            --border-focus: #d1d9e6;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --accent-glow: rgba(37, 99, 235, 0.08);
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.2s ease;
        }

        body {
            font-family: var(--font);
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ----- SIDEBAR ----- */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            color: #e2e8f0;
            padding: 2rem 1.2rem;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            border-right: 1px solid #1e2a3a;
            z-index: 10;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #2d3a4e;
            border-radius: 8px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding-bottom: 1.8rem;
            border-bottom: 1px solid #1e2a3a;
            margin-bottom: 1.8rem;
        }

        .sidebar-brand .icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
        }

        .sidebar-brand h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .sidebar-brand h1 span {
            color: var(--accent);
        }
        .sidebar-brand .sub {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 1px;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.5rem 0.8rem;
            border-radius: var(--radius-sm);
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 450;
            transition: var(--transition);
            cursor: pointer;
        }

        .sidebar-nav a .num {
            font-size: 0.65rem;
            font-weight: 600;
            opacity: 0.4;
            min-width: 26px;
            color: #94a3b8;
        }

        .sidebar-nav a .title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-nav a .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #2d3a4e;
            transition: var(--transition);
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #f1f5f9;
        }

        .sidebar-nav a.active {
            background: rgba(37, 99, 235, 0.12);
            color: #fff;
        }
        .sidebar-nav a.active .dot {
            background: var(--accent);
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
        }
        .sidebar-nav a.active .num {
            opacity: 0.8;
            color: #fff;
        }

        .sidebar-footer {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid #1e2a3a;
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
        }
        .sidebar-footer strong {
            color: #fbbf24;
        }

        /* ----- MAIN ----- */
        .main {
            flex: 1;
            padding: 2.5rem 3rem 4rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .main-header {
            margin-bottom: 2.5rem;
        }

        .main-header .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .main-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .main-header .sub {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 2px;
        }

        .main-header .badge-count {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 0.35rem 1.4rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            box-shadow: var(--shadow-card);
        }
        .main-header .badge-count strong {
            color: var(--text-primary);
        }

        /* ----- PROMPT LIST (modern, card-free) ----- */
        .prompt-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .prompt-entry {
            display: flex;
            align-items: stretch;
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            transition: var(--transition);
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .prompt-entry:hover {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        .prompt-number {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 56px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            background: #fafcff;
            border-right: 1px solid var(--border-light);
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }

        .prompt-content {
            flex: 1;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .prompt-content .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .prompt-content .header-row h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .prompt-content .header-row .tags {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .prompt-content .header-row .tags .tag {
            background: var(--bg-base);
            border: 1px solid var(--border-light);
            border-radius: 30px;
            padding: 0.1rem 0.8rem;
            font-size: 0.6rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
        }

        .prompt-body-text {
            font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.7;
            color: #1e293b;
            background: #fafcff;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 120px;
            overflow-y: auto;
            transition: max-height 0.25s ease;
        }

        .prompt-body-text.expanded {
            max-height: 800px;
        }

        .prompt-body-text::-webkit-scrollbar {
            width: 3px;
        }
        .prompt-body-text::-webkit-scrollbar-thumb {
            background: var(--border-focus);
            border-radius: 8px;
        }

        .prompt-body-text .role {
            color: #7c3aed;
            font-weight: 600;
        }
        .prompt-body-text .bullet {
            color: #059669;
        }
        .prompt-body-text .highlight {
            color: #b45309;
            font-weight: 500;
        }

        .prompt-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.2rem;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: 30px;
            padding: 0.2rem 1.2rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .copy-btn i {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .copy-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }
        .copy-btn:hover i {
            color: var(--accent);
        }

        .copy-btn.copied {
            background: #ecfdf5;
            border-color: #34d399;
            color: #065f46;
        }
        .copy-btn.copied i {
            color: #34d399;
        }

        .expand-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .expand-btn:hover {
            background: var(--bg-base);
            color: var(--text-primary);
        }

        /* ----- responsive ----- */
        @media (max-width: 820px) {
            .sidebar {
                width: 220px;
                padding: 1.2rem 0.8rem;
            }
            .main {
                padding: 1.5rem 1.2rem;
            }
            .prompt-content {
                padding: 0.8rem 1rem;
            }
            .prompt-number {
                min-width: 44px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 640px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 1rem;
                border-right: none;
                border-bottom: 1px solid #1e2a3a;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.8rem;
            }
            .sidebar-brand {
                padding-bottom: 0;
                border-bottom: none;
                margin-bottom: 0;
                flex: 1;
            }
            .sidebar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 2px;
                flex: 1 1 100%;
                order: 3;
            }
            .sidebar-nav a {
                padding: 0.3rem 0.7rem;
                font-size: 0.75rem;
            }
            .sidebar-nav a .num {
                min-width: 20px;
                font-size: 0.6rem;
            }
            .sidebar-footer {
                display: none;
            }
            .main {
                padding: 1.2rem;
            }
            .main-header h2 {
                font-size: 1.4rem;
            }
            .prompt-entry {
                flex-direction: column;
                border-radius: var(--radius-sm);
            }
            .prompt-number {
                border-right: none;
                border-bottom: 1px solid var(--border-light);
                padding: 0.3rem 0;
                min-width: auto;
                background: transparent;
                justify-content: flex-start;
                padding-left: 1rem;
                font-size: 0.7rem;
            }
            .prompt-content {
                padding: 0.8rem;
            }
            .prompt-body-text {
                font-size: 0.75rem;
                max-height: 100px;
                padding: 0.6rem 0.8rem;
            }
            .prompt-body-text.expanded {
                max-height: 600px;
            }
        }

        @media (max-width: 400px) {
            .main-header .top {
                flex-direction: column;
                align-items: flex-start;
            }
            .prompt-content .header-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* scroll behaviour */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

    <script>
        (function() {
            // ----- DATA -----
            const titles = [

            const prompts = [

            const tagGroups = [
                ["#analysis", "#exploration"],

                ["#forecast", "#planning"],

                ["#kpi", "#review"],
                ["#storytelling", "#narrative"],
                ["#presentation", "#board"],
                ["#governance", "#compliance"],
                ["#risk", "#assessment"],
                ["#ai", "#opportunity"],
                ["#automation", "#process"],
                ["#decisions", "#support"],
                ["#review", "#quality"],
                ["#consultant", "#strategy"]
            ];

            // ----- RENDER -----
            const sidebarNav = document.getElementById('sidebarNav');
            const promptList = document.getElementById('promptList');

            let sidebarHTML = '';
            let listHTML = '';

            for (let i = 0; i < prompts.length; i++) {
                const num = i + 1;
                const title = titles[i];
                const text = prompts[i];
                const tags = tagGroups[i] || ['#prompt'];

                // sidebar
                sidebarHTML += `
                    <a href="#prompt-${num}" data-index="${i}" class="${i === 0 ? 'active' : ''}">
                        <span class="num">${String(num).padStart(2, '0')}</span>
                        <span class="title">${title}</span>
                        <span class="dot"></span>
                    </a>
                `;

                // list
                const tagHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');

                // escape & decorate text
                let decorated = text
                    .replace(/•/g, '<span class="bullet">•</span>')
                    .replace(/Act as/g, '<span class="role">Act as</span>');

                // highlight common keywords
                const keywords = ['Requirements', 'Identify', 'Include', 'Analyze', 'Explain', 'Perform',
                    'Design', 'Generate', 'Suggest', 'Evaluate', 'Recommend', 'Review', 'Provide',
                    'Determine', 'Create', 'Investigate', 'Detect', 'Design', 'Turn', 'Prepare',
                    'Find', 'Score', 'Assess', 'Compare', 'Rank', 'Prioritize', 'Goal'
                ];
                const regex = new RegExp(`\\b(${keywords.join('|')})\\b`, 'g');
                decorated = decorated.replace(regex, '<span class="highlight">$1</span>');

                listHTML += `
                    <div class="prompt-entry" id="prompt-${num}">
                        <div class="prompt-number">${String(num).padStart(2, '0')}</div>
                        <div class="prompt-content">
                            <div class="header-row">
                                <h3>${title}</h3>
                                <div class="tags">${tagHTML}</div>
                            </div>
                            <div class="prompt-body-text" data-expanded="false">${decorated}</div>
                            <div class="prompt-actions">
                                <button class="copy-btn" data-prompt="prompt-${num}"><i class="fas fa-copy"></i> Copy</button>
                                <button class="expand-btn" data-target="prompt-${num}">
                                    <i class="fas fa-chevron-down"></i> <span>Expand</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            sidebarNav.innerHTML = sidebarHTML;
            promptList.innerHTML = listHTML;

            // ----- SIDEBAR NAV -----
            document.querySelectorAll('.sidebar-nav a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
                    this.classList.add('active');

                    const target = this.getAttribute('href');
                    const el = document.querySelector(target);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            });

            // ----- COPY -----
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const targetId = this.getAttribute('data-prompt');
                    const el = document.getElementById(targetId);
                    if (!el) return;

                    const bodyEl = el.querySelector('.prompt-body-text') || el;
                    let text = bodyEl.innerText.trim();

                    navigator.clipboard.writeText(text).then(() => {
                        const orig = this.innerHTML;
                        this.innerHTML = '<i class="fas fa-check"></i> Copied!';
                        this.classList.add('copied');
                        setTimeout(() => {
                            this.innerHTML = orig;
                            this.classList.remove('copied');
                        }, 2000);
                    }).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        const orig = this.innerHTML;
                        this.innerHTML = '<i class="fas fa-check"></i> Copied!';
                        this.classList.add('copied');
                        setTimeout(() => {
                            this.innerHTML = orig;
                            this.classList.remove('copied');
                        }, 2000);
                    });
                });
            });

            // ----- EXPAND / COLLAPSE -----
            document.querySelectorAll('.expand-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const entry = document.getElementById(targetId);
                    if (!entry) return;

                    const body = entry.querySelector('.prompt-body-text');
                    if (!body) return;

                    const isExpanded = body.dataset.expanded === 'true';
                    if (isExpanded) {
                        body.classList.remove('expanded');
                        body.dataset.expanded = 'false';
                        this.innerHTML = '<i class="fas fa-chevron-down"></i> <span>Expand</span>';
                    } else {
                        body.classList.add('expanded');
                        body.dataset.expanded = 'true';
                        this.innerHTML = '<i class="fas fa-chevron-up"></i> <span>Collapse</span>';
                    }
                });
            });

            // ----- SCROLL SPY -----
            const entries = document.querySelectorAll('.prompt-entry');
            const links = document.querySelectorAll('.sidebar-nav a');

            const observer = new IntersectionObserver((observed) => {
                observed.forEach(ob => {
                    if (ob.isIntersecting) {
                        const id = ob.target.id;
                        links.forEach(link => {
                            link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
                        });
                    }
                });
            }, { threshold: 0.35 });

            entries.forEach(entry => observer.observe(entry));

            // total count
            document.getElementById('totalCount').textContent = prompts.length;

            // if on load, first active
            setTimeout(() => {
                const first = document.querySelector('.prompt-entry');
                if (first) {
                    const id = first.id;
                    links.forEach(link => {
                        link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
                    });
                }
            }, 100);
        })();
    </script>
