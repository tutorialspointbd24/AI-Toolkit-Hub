<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🧠 AI Prompt Reference · 50 Prompts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1a1f2e;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --border-color: #2d3548;
      --glass-bg: rgba(26, 31, 46, 0.75);
    }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      background: var(--bg-primary);
      background-image: 
        radial-gradient(ellipse at 15% 15%, rgba(59,130,246,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 85%, rgba(139,92,246,0.06) 0%, transparent 50%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2.5rem 1.5rem 4rem;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .header .sub {
      color: var(--text-secondary);
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }

    .header .badge {
      display: inline-block;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 60px;
      padding: 0.3rem 1.8rem;
      font-size: 0.85rem;
      color: var(--accent-cyan);
      margin-bottom: 1rem;
    }

    .timeline {
      position: relative;
      padding-left: 60px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 29px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, 
        var(--accent-blue), var(--accent-purple), var(--accent-cyan), 
        var(--accent-green), var(--accent-orange), var(--accent-pink),
        #6366f1, #14b8a6, #f472b6, #a78bfa
      );
      border-radius: 10px;
      animation: growLine 1.2s ease-out;
    }

    @keyframes growLine {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    .timeline-item {
      position: relative;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeSlideIn 0.5s ease-out forwards;
    }

    .timeline-item:nth-child(1) { animation-delay: 0.05s; }
    .timeline-item:nth-child(2) { animation-delay: 0.1s; }
    .timeline-item:nth-child(3) { animation-delay: 0.15s; }
    .timeline-item:nth-child(4) { animation-delay: 0.2s; }
    .timeline-item:nth-child(5) { animation-delay: 0.25s; }
    .timeline-item:nth-child(6) { animation-delay: 0.3s; }
    .timeline-item:nth-child(7) { animation-delay: 0.35s; }
    .timeline-item:nth-child(8) { animation-delay: 0.4s; }

    .timeline-item:nth-child(13) { animation-delay: 0.65s; }
    .timeline-item:nth-child(14) { animation-delay: 0.7s; }
    .timeline-item:nth-child(15) { animation-delay: 0.75s; }
    .timeline-item:nth-child(16) { animation-delay: 0.8s; }
    .timeline-item:nth-child(17) { animation-delay: 0.85s; }
    .timeline-item:nth-child(18) { animation-delay: 0.9s; }
    .timeline-item:nth-child(19) { animation-delay: 0.95s; }
    .timeline-item:nth-child(20) { animation-delay: 1.0s; }
    .timeline-item:nth-child(21) { animation-delay: 1.05s; }
    .timeline-item:nth-child(22) { animation-delay: 1.1s; }
    .timeline-item:nth-child(23) { animation-delay: 1.15s; }
    .timeline-item:nth-child(24) { animation-delay: 1.2s; }
    .timeline-item:nth-child(25) { animation-delay: 1.25s; }
    .timeline-item:nth-child(26) { animation-delay: 1.3s; }
    .timeline-item:nth-child(27) { animation-delay: 1.35s; }
    .timeline-item:nth-child(28) { animation-delay: 1.4s; }
    .timeline-item:nth-child(29) { animation-delay: 1.45s; }

    .timeline-item:nth-child(31) { animation-delay: 1.55s; }
    .timeline-item:nth-child(32) { animation-delay: 1.6s; }
    .timeline-item:nth-child(33) { animation-delay: 1.65s; }
    .timeline-item:nth-child(34) { animation-delay: 1.7s; }
    .timeline-item:nth-child(35) { animation-delay: 1.75s; }
    .timeline-item:nth-child(36) { animation-delay: 1.8s; }
    .timeline-item:nth-child(37) { animation-delay: 1.85s; }

    .timeline-item:nth-child(43) { animation-delay: 2.15s; }
    .timeline-item:nth-child(44) { animation-delay: 2.2s; }
    .timeline-item:nth-child(45) { animation-delay: 2.25s; }

    .timeline-item:nth-child(49) { animation-delay: 2.45s; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .timeline-dot {
      position: absolute;
      left: -47px;
      top: 28px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 3px solid var(--accent-blue);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent-blue);
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    .timeline-item:hover .timeline-dot {
      transform: scale(1.3);
      box-shadow: 0 0 40px rgba(59,130,246,0.3);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 1.8rem 2.2rem;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .glass-card:hover::before {
      opacity: 1;
    }

    .glass-card:hover {
      border-color: rgba(255,255,255,0.15);
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      transform: translateY(-4px);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .card-title .num {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0.4;
      line-height: 1;
    }

    .card-title h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .card-title .sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 400;
      display: block;
      margin-top: 0.1rem;
    }

    .copy-btn {
      background: rgba(59,130,246,0.06);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 40px;
      padding: 0.4rem 1.4rem;
      color: #93c5fd;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .copy-btn i {
      font-size: 0.9rem;
      color: var(--accent-blue);
    }

    .copy-btn:hover {
      background: rgba(59,130,246,0.15);
      border-color: rgba(59,130,246,0.4);
      transform: scale(1.02);
    }

    .copy-btn.copied {
      background: rgba(16,185,129,0.15);
      border-color: rgba(16,185,129,0.3);
      color: #6ee7b7;
    }

    .copy-btn.copied i {
      color: var(--accent-green);
    }

    .prompt-body {
      background: rgba(0,0,0,0.25);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.04);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: #d1d9e8;
      max-height: 500px;
      overflow-y: auto;
    }

    .prompt-body::-webkit-scrollbar {
      width: 4px;
    }
    .prompt-body::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
    }
    .prompt-body::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }

    .prompt-body .role {
      color: #c084fc;
      font-weight: 600;
    }

    .prompt-body .bullet {
      color: #34d399;
    }

    .prompt-body .highlight {
      color: #fbbf24;
    }

    .prompt-body .comment {
      color: #64748b;
      font-style: italic;
    }

    .card-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .tag {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-color);
      border-radius: 40px;
      padding: 0.2rem 1rem;
      font-size: 0.7rem;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .tag i {
      font-size: 0.6rem;
      color: var(--accent-cyan);
    }

    .footer-note {
      margin-top: 3.5rem;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      border-top: 1px solid var(--border-color);
      padding-top: 2rem;
    }

    .footer-note strong {
      color: #fbbf24;
    }

    .formula {
      display: inline-block;
      background: rgba(251,191,36,0.06);
      border: 1px solid rgba(251,191,36,0.15);
      padding: 0.3rem 1.5rem;
      border-radius: 40px;
      font-size: 0.8rem;
      color: #fcd34d;
      margin-top: 0.5rem;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatUp linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    @media (max-width: 768px) {
      .timeline { padding-left: 40px; }
      .timeline-dot { left: -42px; width: 30px; height: 30px; font-size: 0.65rem; top: 22px; }
      .glass-card { padding: 1.2rem 1.4rem; }
      .card-title h2 { font-size: 1.1rem; }
      .card-title .num { font-size: 1.8rem; }
      .prompt-body { font-size: 0.75rem; padding: 1rem; max-height: 350px; }
      .copy-btn { padding: 0.3rem 1rem; font-size: 0.75rem; }
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 1.8rem; }
      .card-title { flex-wrap: wrap; }
      .card-title .num { font-size: 1.5rem; }
      .card-header { flex-direction: column; align-items: stretch; }
      .copy-btn { align-self: flex-start; }
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="header">

<script>
  (function() {
    // particles
    const container = document.getElementById('particles');
    const colors = ['#3b82f6', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const size = Math.random() * 3 + 2;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 10 + 10) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      container.appendChild(p);

    // ---------- ALL 50 PROMPTS ----------
    const prompts = [
      // 1
      `Act as a Senior Data Analyst.

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const targetId = this.getAttribute('data-prompt');
        const promptEl = document.getElementById(targetId);
        if (!promptEl) return;

        let text = promptEl.innerText.trim();

        navigator.clipboard.writeText(text).then(() => {
          const orig = this.innerHTML;
          this.innerHTML = '<i class="fas fa-check"></i> Copied!';
          this.classList.add('copied');
          setTimeout(() => {
            this.innerHTML = orig;
            this.classList.remove('copied');
          }, 2000);
        }).catch(() => {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          const orig = this.innerHTML;
          this.innerHTML = '<i class="fas fa-check"></i> Copied!';
          this.classList.add('copied');
          setTimeout(() => {
            this.innerHTML = orig;
            this.classList.remove('copied');
          }, 2000);
        });
      });
