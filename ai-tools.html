<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="logo.png"> 
    <title>AI Tools Hub - Complete Directory of AI Tools</title>
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #eef3fc 0%, #e0e9f7 100%);
            min-height: 100vh;
            padding: 20px;
            color: #0b1e33;
            position: relative;
        }

        /* Animated background blobs */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(45, 122, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: blobFloat 20s ease-in-out infinite alternate;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: blobFloat 25s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        @keyframes blobFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.1); }
            66% { transform: translate(-30px, 60px) scale(0.9); }
            100% { transform: translate(40px, -20px) scale(1.05); }
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           HEADER — Premium Glass Morphism
           ============================================================ */
        .header {
            text-align: center;
            padding: 50px 40px 44px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            box-shadow: 0 20px 60px rgba(18, 52, 106, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(45, 122, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header .logo-icon {
            font-size: 3.6rem;
            background: linear-gradient(135deg, #1a4a9e, #2d7aff, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        .header h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #0b2b5c 0%, #1a5adf 40%, #2d7aff 70%, #6c5ce7 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
            animation: gradientShift 6s ease-in-out infinite alternate;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .header .subtitle {
            font-size: 1.25rem;
            font-weight: 500;
            color: #2a4e7a;
            margin-top: 8px;
            opacity: 0.85;
            position: relative;
            z-index: 1;
        }

        .header .badge-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }

        .header .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #1a3a7a, #2d7aff);
            color: white;
            padding: 10px 30px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 28px rgba(45, 122, 255, 0.30);
            transition: all 0.3s ease;
        }

        .header .badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(45, 122, 255, 0.40);
        }

        .header .badge-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(45, 122, 255, 0.15);
            color: #1a3a7a;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .header .badge-outline:hover {
            background: white;
            border-color: #2d7aff;
            transform: translateY(-2px);
        }

        /* ============================================================
           SEARCH BAR — Premium
           ============================================================ */
        .search-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 6px 6px 6px 28px;
            border-radius: 80px;
            box-shadow: 0 12px 48px rgba(18, 52, 106, 0.08);
            width: 100%;
            max-width: 700px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .search-box:focus-within {
            border-color: #2d7aff;
            box-shadow: 0 16px 56px rgba(45, 122, 255, 0.15);
            transform: scale(1.01) translateY(-2px);
            background: rgba(255, 255, 255, 0.95);
        }

        .search-box i:first-child {
            color: #7a9bc7;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .search-box:focus-within i:first-child {
            color: #2d7aff;
        }

        .search-box input {
            border: none;
            padding: 16px 20px;
            font-size: 1rem;
            width: 100%;
            background: transparent;
            outline: none;
            color: #0b2b5c;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }

        .search-box input::placeholder {
            color: #a0bcdb;
            font-weight: 400;
        }

        .search-box button {
            background: linear-gradient(135deg, #1a4a9e, #2d7aff);
            border: none;
            color: white;
            padding: 14px 38px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(45, 122, 255, 0.20);
        }

        .search-box button:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 12px 36px rgba(45, 122, 255, 0.45);
        }

        .search-box button:active {
            transform: scale(0.96);
        }

        /* ============================================================
           FILTER TABS — Pill Style
           ============================================================ */
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 44px;
        }

        .filter-tabs button {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 24px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #1e3f66;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .filter-tabs button:hover {
            background: white;
            border-color: #b8d2f0;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .filter-tabs button.active {
            background: linear-gradient(135deg, #1a3a7a, #2d7aff);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 28px rgba(26, 58, 122, 0.25);
            transform: translateY(-3px);
        }

        .filter-tabs button .count {
            background: rgba(255, 255, 255, 0.15);
            padding: 0 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .filter-tabs button.active .count {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ============================================================
           TOOLS GRID — Masonry Style with Premium Cards
           ============================================================ */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
        }

        /* ============================================================
           TOOL CARD — Premium Glass Card with 3D Hover
           ============================================================ */
        .tool-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 30px 28px 26px;
            box-shadow: 0 8px 32px rgba(18, 52, 106, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
        }

        /* Animated gradient border on hover */
        .tool-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 34px;
            padding: 2px;
            background: linear-gradient(135deg, #2d7aff, #6c5ce7, #2d7aff);
            background-size: 200% 200%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
            animation: borderRotate 3s ease-in-out infinite;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .tool-card:hover::before {
            opacity: 1;
        }

        .tool-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 32px 72px rgba(18, 52, 106, 0.14);
            background: rgba(255, 255, 255, 0.95);
            border-color: transparent;
        }

        .tool-card:active {
            transform: scale(0.97) translateY(-4px);
        }

        /* Subtle shine effect */
        .tool-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .tool-card:hover::after {
            opacity: 1;
        }

        /* Card header with icon */
        .tool-card .card-top {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .tool-card .icon-wrapper {
            width: 64px;
            height: 64px;
            min-width: 64px;
            background: linear-gradient(135deg, #e6effa, #d0e2f7);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #1a4a9e;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }

        .tool-card:hover .icon-wrapper {
            background: linear-gradient(135deg, #1a4a9e, #2d7aff);
            color: white;
            box-shadow: 0 12px 32px rgba(45, 122, 255, 0.30);
            transform: scale(1.05) rotate(-3deg);
        }

        .tool-card .name-category {
            flex: 1;
        }

        .tool-card .name-category h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0b2140;
            line-height: 1.2;
        }

        .tool-card .category-badge {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #2d7aff;
            background: #e3edfc;
            padding: 4px 16px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 4px;
            transition: all 0.3s;
        }

        .tool-card:hover .category-badge {
            background: #d0e2f7;
        }

        /* Description */
        .tool-card .description {
            color: #2f5278;
            font-size: 0.95rem;
            line-height: 1.7;
            flex: 1;
            margin: 6px 0 20px 0;
            position: relative;
            z-index: 1;
        }

        /* Card footer */
        .tool-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            position: relative;
            z-index: 1;
        }

        .tool-card .price-tag {
            font-size: 0.75rem;
            font-weight: 700;
            color: #1e3f66;
            background: #eef4fa;
            padding: 6px 20px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .tool-card:hover .price-tag {
            background: #e3edfc;
        }

        .tool-card .visit-link {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a4a9e;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .tool-card:hover .visit-link {
            color: #2d7aff;
            gap: 14px;
        }

        .tool-card .visit-link i {
            font-size: 0.75rem;
            transition: all 0.3s;
        }

        .tool-card:hover .visit-link i {
            transform: translateX(6px);
        }

        /* ============================================================
           NO RESULT
           ============================================================ */
        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 30px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            color: #1e3f66;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .no-result i {
            font-size: 4rem;
            display: block;
            margin-bottom: 20px;
            color: #7a9bc7;
        }

        .no-result h3 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .no-result p {
            font-size: 1rem;
            opacity: 0.7;
        }

        /* ============================================================
           FOOTER — Premium
           ============================================================ */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 36px 10px 12px;
            color: #3f6b92;
            font-weight: 500;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
        }

        .footer span {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            padding: 10px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: inline-block;
        }

        .footer span i {
            color: #2d7aff;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 24px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 14px;
            }
            .header {
                padding: 32px 20px 28px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 2.6rem;
            }
            .header .subtitle {
                font-size: 1rem;
            }
            .header .logo-icon {
                font-size: 2.8rem;
            }
            .header .badge,
            .header .badge-outline {
                font-size: 0.75rem;
                padding: 8px 18px;
            }
            .search-box {
                flex-wrap: wrap;
                background: transparent;
                box-shadow: none;
                padding: 0;
                border: none;
                gap: 12px;
                backdrop-filter: none;
            }
            .search-box input {
                background: rgba(255, 255, 255, 0.9);
                border-radius: 60px;
                padding: 16px 24px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
                backdrop-filter: blur(8px);
            }
            .search-box button {
                width: 100%;
                justify-content: center;
                padding: 16px;
            }
            .search-box i:first-child {
                display: none;
            }
            .filter-tabs button {
                font-size: 0.78rem;
                padding: 8px 16px;
            }
            .tools-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .tool-card {
                padding: 24px 20px 20px;
            }
            .tool-card .icon-wrapper {
                width: 54px;
                height: 54px;
                min-width: 54px;
                font-size: 1.8rem;
            }
            .tool-card .name-category h3 {
                font-size: 1.15rem;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }
            .header .badge,
            .header .badge-outline {
                font-size: 0.65rem;
                padding: 6px 14px;
            }
            .filter-tabs button {
                font-size: 0.7rem;
                padding: 6px 14px;
            }
            .filter-tabs button .count {
                font-size: 0.6rem;
                padding: 0 6px;
            }
            .tool-card .card-top {
                gap: 12px;
            }
            .tool-card .icon-wrapper {
                width: 48px;
                height: 48px;
                min-width: 48px;
                font-size: 1.5rem;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ==========================================================
        HEADER — Premium Glass
        ========================================================== -->
        <header class="header">
            <div class="logo-icon"><i class="fas fa-robot"></i></div>

        <!-- ==========================================================
        SEARCH — Premium
        ========================================================== -->
        <div class="search-wrapper">

        </div>

        <!-- ==========================================================

        ========================================================== -->
        <div class="tools-grid" id="toolsGrid"></div>

        <!-- ==========================================================
        FOOTER
        ========================================================== -->
        <div class="footer">
            <span><i class="fas fa-brain" style="margin-right:8px;"></i> AI Tools Hub · All modern AI tools in one place</span>
        </div>
    </div>

    <script>
        // =============================================================
        //  DATA — All tools with English descriptions
        // =============================================================
        const toolsData = [
            // ---- CHATBOTS ----
            { id: 1, name: 'ChatGPT', category: 'chatbot', icon: 'fa-comment-dots', desc: 'OpenAI\'s flagship model with GPT-4o, deep research, and custom GPTs.', price: 'Free / Paid', url: 'https://chat.openai.com' },

        // =============================================================
        //  DOM REFS
        // =============================================================
        const grid = document.getElementById('toolsGrid');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const filterBtns = document.querySelectorAll('.filter-tabs button');

        let currentCategory = 'all';
        let currentSearch = '';

        // =============================================================
        //  RENDER FUNCTION
        // =============================================================
        function renderTools() {
            const filtered = toolsData.filter(tool => {
                const matchCategory = currentCategory === 'all' || tool.category === currentCategory;
                const query = currentSearch.toLowerCase().trim();
                const matchSearch = query === '' ||
                    tool.name.toLowerCase().includes(query) ||
                    tool.desc.toLowerCase().includes(query) ||
                    tool.category.includes(query);
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-result">
                        <i class="fas fa-face-frown"></i>
                        <h3>No tools found</h3>
                        <p>Try adjusting your search or filter criteria</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(tool => `
                <a href="${tool.url}" target="_blank" rel="noopener noreferrer" class="tool-card">
                    <div class="card-top">
                        <div class="icon-wrapper"><i class="fas ${tool.icon}"></i></div>
                        <div class="name-category">
                            <h3>${tool.name}</h3>
                            <span class="category-badge">${tool.category}</span>
                        </div>
                    </div>
                    <p class="description">${tool.desc}</p>
                    <div class="card-footer">
                        <span class="price-tag"><i class="fas fa-tag" style="font-size:0.65rem;"></i> ${tool.price}</span>
                        <span class="visit-link">Visit <i class="fas fa-arrow-right"></i></span>
                    </div>
                </a>
            `).join('');
        }

        // =============================================================
        //  EVENT LISTENERS
        // =============================================================

        // 1. Filter buttons
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderTools();
            });
        });

        // 2. Search
        function performSearch() {
            currentSearch = searchInput.value;
            renderTools();
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // 3. Live search on input (optional — uncomment if desired)
        // searchInput.addEventListener('input', performSearch);

        // =============================================================
        //  INITIAL RENDER
        // =============================================================
        renderTools();
    </script>
